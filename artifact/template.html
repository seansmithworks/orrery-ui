<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE (2-4 words)</title>
<!--HEAD-->
</head>
<body class="body">
<main class="os-container">
<article class="os-doc">
<div class="os-front">
<div class="os-masthead">
  <h1 class="title">PAGE HEADLINE</h1>
</div>
<section class="os-answer" aria-label="The answer">
  <div>
    <p class="lead">THE DECISION, IN ONE SENTENCE.</p>
    <p class="os-support">SUPPORTING PROSE.</p>
  </div>
</section>
<section class="os-decisions os-lift" aria-labelledby="dec-h">
  <div class="os-decisions-head">
    <h2 class="os-sh heading" id="dec-h">Waiting on you</h2>
  </div>
  <ol>
    <!-- decision: subhead, why, inset opening with the source's word as a lede-in (Recommended:, Strawman: or Default:) -->
    <li class="os-dec">
      <span class="os-dec-n data">01</span>
      <div><div class="subhead">DECISION</div><p class="os-dec-why body-sm">WHY.</p></div>
      <div class="os-inset"><div class="os-rec-v body-sm"><strong>Recommended:</strong> RECOMMENDATION</div></div>
    </li>
    <!-- ask / to-do: subhead and why, no inset
    <li class="os-dec">
      <span class="os-dec-n data">02</span>
      <div><div class="subhead">ASK</div><p class="os-dec-why body-sm">WHY.</p></div>
    </li> -->
    <!-- options: fieldset.os-choices with the question as its legend (interactive; memo mode), or subhead then ul.os-list (static)
    <li class="os-dec">
      <span class="os-dec-n data">03</span>
      <fieldset class="os-choices"><legend class="subhead">QUESTION</legend>
        <label class="os-choice"><input type="radio" name="q3" value="a"><span><span class="subhead">OPTION</span><span class="body-sm">SUB</span></span></label>
      </fieldset>
    </li> -->
    <!-- checkable: label.os-check replaces the number and body
    <li class="os-dec">
      <label class="os-check"><input type="checkbox" id="c-1"><span><strong>LEDE.</strong> REST</span></label>
    </li> -->
  </ol>
</section>
</div>
<!-- rail toc: only with 4+ sections, else delete; labels are the h2 text verbatim; first entry is the decisions sheet -->
<nav class="os-toc os-toc--side label" aria-label="Sections">
  <a href="#dec-h">Waiting on you</a><a href="#s-one">SECTION HEAD</a>
</nav>
<div class="os-evidence">
<section class="os-sec" id="s-one">
  <h2 class="os-sh heading">SECTION HEAD</h2>
  <!-- .os-list / .os-steps / .os-table / .os-ledger / .os-tally / .os-callout / .os-disclosure: copy from snapshot previews -->
</section>
<!-- optional footer: date, branch and source live here, once; a sentence is p.os-footer.body-sm.os-muted -->
<p class="os-footer body-sm os-muted">FOOTER SENTENCE.</p>
</div>
</article>
</main>
</body>
</html>
