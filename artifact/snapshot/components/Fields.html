<!-- @dsCard group="Content" height=470 subtitle="Checkbox rows, choice tiles and a note field" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox rows, choice tiles and a note field</title>
<style>
body { padding: var(--space-24); }
</style>
</head>
<body class="body">
<div style="display:flex;flex-direction:column;gap:var(--space-24);max-width:var(--layout-measure)">
<div style="display:flex;flex-direction:column;gap:var(--space-12)">
  <label class="os-check"><input type="checkbox" id="c-walk" checked><span><strong>Walk the preview.</strong> Open the gallery and pick one card per tier.</span></label>
  <label class="os-check"><input type="checkbox" id="c-log"><span><strong>Log the pick.</strong> Rounds-to-pick and the pick's tier.</span></label>
</div>
<fieldset class="os-choices"><legend class="subhead">Extend shotfun or start a new skill?</legend>
  <label class="os-choice"><input type="radio" name="q1" value="extend" checked><span><span class="subhead">Extend shotfun</span><span class="body-sm">Keeps the incident-derived rules.</span></span><span class="os-chip os-chip--outline label">My pick</span></label>
  <label class="os-choice"><input type="radio" name="q1" value="new"><span><span class="subhead">Start a new skill</span><span class="body-sm">Clean slate; rewrites usually lose.</span></span></label>
</fieldset>
<div class="os-field"><label class="label" for="q1-note">Note</label><textarea id="q1-note" placeholder="Anything the pick should carry"></textarea><output class="caption" for="q1-note">Saved on this device</output></div>
</div>
<script>/* static preview: CSS-only system */</script>
</body>
</html>
