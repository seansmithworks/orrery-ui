name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The kit catalog (kit/catalog/check.mjs): entries match the components, their examples and kit/catalog.json.
      - run: npm run catalog:check
      - run: node kit/catalog/test.mjs
      # The specimen's forced states (example/kit-preview.css) equal a fresh build from the kit's real state rules.
      - run: npm run kit-preview:check
      - run: node example/kit-preview.test.mjs

  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # python3 ships with ubuntu-latest; head.py and its tests are stdlib only.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run tokens:build
      # The build just rewrote tokens/generated/, so a diff here means the committed files were stale.
      - run: test -z "$(git status --porcelain -- tokens/generated)"
      - run: npm run tokens:check
      - run: node tokens/test.mjs
      # The registry self-check runs inside tokens:check above. This runs the one source rule that passes on src/ today.
      - run: npm run rules:check -- --only literal-color src/styles.module.css
      - run: npm run audit:vars
      # kit/ is held to every source rule.
      - run: test ! -d kit || npm run rules:check -- kit
      - run: node artifact/check/test.mjs
      - run: python3 -I artifact/check/test_head.py

  # Computed-style gate for Iris's CSS defaults (example/role-fallbacks.spec.ts).
  # Chromium only: the committed baseline is keyed per project and only chromium
  # is recorded. The full npm run test:geometry is not run here yet.
  roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:roles
      # Kit exemplars (example/kit.spec.ts): axe, keyboard, focus ring, hit area, reduced motion. Chromium only.
      - run: npx playwright test -c example/playwright.config.ts kit.spec.ts --project=chromium
      # Kit specimen look lock (example/kit-baseline.spec.ts): computed styles of every specimen cell in all
      # three panels plus the open live dialog, against example/kit-baseline/<block>.json. Computed styles, not pixels,
      # because this runner is Linux and development is macOS. Deliberately excluded: text-derived width and
      # height (recorded only for text-free elements), transform/translate/scale, and the painted font face
      # (font-family records the declared stack). A kit CSS change that alters any recorded value fails with
      # block, cell, element, property, baseline and actual; a block with no baseline file fails. After an
      # intended look change, rewrite with UPDATE_KIT_BASELINE=1 KIT_BASELINE_BLOCKS=<Name>[,<Name>] (or =* for
      # every block; update mode without it fails) npm run test:kit-baseline and commit it, or take the block's
      # file from the kit-baseline-actual artifact this job uploads on failure. CI never sets those variables.
      - id: kit-baseline
        run: npm run test:kit-baseline
      - if: failure() && steps.kit-baseline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: kit-baseline-actual
          path: test-results/kit-baseline-actual/
          if-no-files-found: ignore
      # The opt-in Iris bridge (example/role-bridge.spec.ts): light and bridge-alone equal bare, dark is its own baseline.
      - run: npm run test:bridge
